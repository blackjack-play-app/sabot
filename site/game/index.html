<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Blackjack Play — Table de blackjack</title>
<meta name="description" content="Entraîneur de blackjack en 3D : stratégie de base, comptage de cartes, simulateur. Jetons fictifs uniquement.">
<meta name="theme-color" content="#0b0907">
<link rel="icon" href="../assets/img/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="../manifest.webmanifest">
<link rel="stylesheet" href="css/game.css">
<script src="../assets/js/beacon.js"></script>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="app" class="phase-loading">
  <div id="stage" aria-label="Table de blackjack en 3D"></div>
  <div id="labels" aria-live="polite"></div>

  <!-- Barre supérieure -->
  <header class="topbar">
    <a class="brand" href="../" title="Retour au site">
      <svg viewBox="0 0 32 32" width="26" height="26" aria-hidden="true"><rect x="3" y="5" width="18" height="24" rx="3" fill="#efe6d2" transform="rotate(-10 12 17)"/><rect x="11" y="3" width="18" height="24" rx="3" fill="#c9a24a"/><path d="M20 9c-3 3-5 5-5 7.5a2.5 2.5 0 0 0 4.4 1.6c-.2 1.2-.8 2.2-1.6 2.9h4.4c-.8-.7-1.4-1.7-1.6-2.9a2.5 2.5 0 0 0 4.4-1.6C25 14 23 12 20 9z" fill="#14100c"/></svg>
      <span>Blackjack Play</span>
    </a>
    <nav class="modes" id="modes" aria-label="Mode de jeu"></nav>
    <div class="bank" id="bankBox" title="Jetons fictifs — aucune valeur réelle">
      <span class="bank-label">Jetons fictifs</span>
      <strong id="bank">5 000</strong>
      <span id="bankDelta" class="bank-delta"></span>
    </div>
    <div class="tools" id="tools"></div>
  </header>

  <!-- Panneau du compte -->
  <section class="countbox" id="countBox" hidden>
    <div class="cb-row"><span>Compte courant</span><b id="cbRc">0</b></div>
    <div class="cb-row"><span>Compte réel</span><b id="cbTc">0</b></div>
    <div class="cb-row"><span>Jeux restants</span><b id="cbDecks">6</b></div>
    <div class="cb-meter"><i id="cbPen"></i></div>
    <div class="cb-row cb-bet" id="cbBetRow"><span>Mise conseillée</span><b id="cbBet">1 unité</b></div>
    <div class="cb-sys" id="cbSys">Hi-Lo</div>
  </section>

  <!-- Mes mains (récapitulatif lisible) -->
  <aside class="myhands" id="myHands" hidden></aside>

  <!-- Bulles de conseil / correction -->
  <div class="coach" id="coach" hidden></div>
  <div class="toasts" id="toasts"></div>

  <!-- Dock du bas -->
  <footer class="dock" id="dock">
    <div class="dock-bet" id="dockBet">
      <div class="chips" id="chips"></div>
      <div class="bet-actions">
        <button class="btn ghost" id="btnClear" title="Retirer toutes les mises (X)"></button>
        <button class="btn ghost" id="btnRebet" title="Reprendre les mises précédentes (R)"></button>
        <button class="btn ghost" id="btnDoubleBets" title="Doubler toutes les mises"></button>
        <button class="btn primary deal" id="btnDeal" title="Distribuer (Espace)">Distribuer <kbd>Espace</kbd></button>
      </div>
      <p class="hint" id="betHint">Choisis un jeton puis clique sur un cercle de mise. Clic droit pour retirer.</p>
    </div>
    <div class="dock-play" id="dockPlay" hidden>
      <div class="play-for" id="playFor"></div>
      <div class="actions" id="actions"></div>
    </div>
    <div class="dock-ins" id="dockIns" hidden>
      <p id="insText">Le croupier montre un as. Assurance ?</p>
      <div class="actions">
        <button class="btn act" data-ins="yes">Oui <kbd>O</kbd></button>
        <button class="btn act" data-ins="no">Non <kbd>N</kbd></button>
      </div>
    </div>
    <div class="dock-wait" id="dockWait" hidden><span class="dots"><i></i><i></i><i></i></span><span id="waitText">Le croupier joue</span></div>
  </footer>

  <!-- Contrôles caméra -->
  <div class="camctl" id="camCtl"></div>

  <!-- Tiroir latéral -->
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header class="drawer-head"><h2 id="drawerTitle"></h2><button class="icon-btn" id="drawerClose" aria-label="Fermer"></button></header>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <!-- Fenêtres -->
  <div class="modal" id="modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true">
      <button class="icon-btn modal-x" id="modalClose" aria-label="Fermer"></button>
      <div id="modalBody"></div>
    </div>
  </div>

  <!-- Exercices plein écran -->
  <section class="drill" id="drill" hidden></section>

  <!-- Chargement -->
  <div class="loader" id="loader">
    <div class="loader-card">
      <div class="loader-title">Blackjack Play</div>
      <div class="loader-bar"><i id="loaderBar"></i></div>
      <p id="loaderText">Préparation de la table…</p>
    </div>
  </div>
  <noscript><div class="noscript">Blackjack Play a besoin de JavaScript et de WebGL pour fonctionner.</div></noscript>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
